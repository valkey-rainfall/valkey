name: lsan-2604-sat

# Saturation rig to force the LeakSanitizer exit hang and capture the hung
# server's stacks. Starts many ASan servers at once, pins both cores with
# stress-ng, and SHUTDOWNs them all together so many exit-time leak scans run
# under heavy CPU + concurrent-fork pressure (the confirmed trigger). CI-faithful
# build, ptrace_scope at default. 6 shards. Fork-only. Manual + branch push.
on:
  workflow_dispatch:
  push:
    branches:
      - rain/lsan-2604-sat

permissions:
  contents: read

jobs:
  sat:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Valkey
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install libbacktrace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ianlancetaylor/libbacktrace
          ref: b9e40069c0b47a722286b94eb5231f7f05c08713
          path: libbacktrace

      - name: Build libbacktrace
        run: cd libbacktrace && ./configure && make && sudo make install

      - name: Environment
        run: |
          uname -a; gcc --version | head -1; nproc; free -m | head -2
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null)"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libzstd-dev libssl-dev tcl8.6 tclx gdb stress-ng

      - name: Build ASan valkey (CI-faithful)
        run: |
          make -j4 all SANITIZER=address SERVER_CFLAGS='-Werror' BUILD_TLS=module BUILD_ZSTD=yes USE_LIBBACKTRACE=yes
          ./src/valkey-server --version

      - name: Saturation capture run
        run: |
          chmod +x lsan-probe/saturate.sh
          lsan-probe/saturate.sh sat 12 24 src/valkey-server src/valkey-cli "$RUNNER_TEMP"
