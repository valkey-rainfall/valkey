name: latdist-probe

# Defrag latency-distribution probe: runs the instrumented memefficiency suite
# (validate_latency logs full latency data instead of asserting) as single
# passes with --clients 1, preserving run_solo semantics. Logs are uploaded
# as artifacts for distribution analysis.
on:
  push:
    branches: [latdist-probe]

concurrency:
  group: latdist-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  latdist:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tclx
      - name: Build (jemalloc)
        run: make -j"$(nproc)"
      - name: Run solo passes
        run: |
          mkdir -p latdist-logs
          for i in $(seq 1 "${PASSES:-20}"); do
            tag=$(printf "pass-%03d" "$i")
            la0=$(cut -d' ' -f1 /proc/loadavg)
            t0=$(date +%s)
            ./runtest --single unit/memefficiency --clients 1 > "latdist-logs/$tag.log" 2>&1 || true
            t1=$(date +%s)
            la1=$(cut -d' ' -f1 /proc/loadavg)
            echo -e "$tag\t$t0\t$t1\t$((t1-t0))\t$la0\t$la1" >> latdist-logs/manifest.tsv
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latdist-${{ matrix.os }}
          path: latdist-logs/
