name: lsan-2604-probe

# Experiment: why does LeakSanitizer hang at exit on the ubuntu-26.04
# runner image but not 24.04? Runs on the fork only. Manual + branch push.
on:
  workflow_dispatch:
  push:
    branches:
      - rain/lsan-2604-probe

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Environment
        run: |
          echo "== image =="; echo "$ImageOS / ${{ matrix.image }}"
          echo "== uname =="; uname -a
          echo "== gcc =="; gcc --version | head -1
          echo "== libasan =="; dpkg -l | grep -i -E 'libasan|gcc-[0-9]+ ' || true
          echo "== ptrace_scope =="; cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo "no yama"
          echo "== seccomp (self) =="; grep -i seccomp /proc/self/status || true
          echo "== apparmor =="; (aa-status 2>/dev/null || cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo "n/a") | head
          echo "== apparmor ptrace restriction =="; cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo "n/a"
          echo "== can i sysctl =="; sudo sysctl kernel.yama.ptrace_scope || true

      - name: Build probes
        run: |
          cd lsan-probe
          gcc -O1 -g -fsanitize=address -pthread lsanprobe.c -o lsanprobe
          gcc -O1 -g ptrace_probe.c -o ptrace_probe
          chmod +x run_loop.sh

      # 1. Does the TestPTrace fork-probe child get signalled on this image?
      - name: ptrace fork-probe x200 (default policy)
        run: |
          cd lsan-probe
          for i in $(seq 1 200); do ./ptrace_probe; done | sort | uniq -c | sort -rn

      - name: ptrace fork-probe x200 (ptrace_scope=0)
        run: |
          cd lsan-probe
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          for i in $(seq 1 200); do ./ptrace_probe; done | sort | uniq -c | sort -rn

      # 2. Does the real ASan exit-time leak scan hang? (default policy)
      - name: lsanprobe x300 (default policy)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          cd lsan-probe
          sudo sysctl -w kernel.yama.ptrace_scope=1 2>/dev/null || true
          OUT=out-default ./run_loop.sh default 300 ./lsanprobe 4

      # 3. Same, but with ptrace_scope=0 (candidate fix #2)
      - name: lsanprobe x300 (ptrace_scope=0)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          cd lsan-probe
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          OUT=out-scope0 ./run_loop.sh scope0 300 ./lsanprobe 4

      # 4. Same, but detect_leaks=0 (candidate fix #3, coverage-dropping)
      - name: lsanprobe x100 (detect_leaks=0)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cd lsan-probe
          sudo sysctl -w kernel.yama.ptrace_scope=1 2>/dev/null || true
          OUT=out-noleak ./run_loop.sh noleak 100 ./lsanprobe 4
